name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A weekly run finds what changes without a commit here: a new advisory, or another repository
  # moving the files this one builds from.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, synth (both stages, cdk-nag)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The database bootstrap's integration test runs against this throwaway server. The test
      # fails, rather than skipping, if CI runs without it.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Synthesis runs every AWS Solutions check; an unacknowledged finding fails here.
      - run: npm run synth
      - run: npm run synth:production
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-assembly
          path: cdk.out
          retention-days: 7

  workflows:
    name: Workflows and scripts are well-formed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rhysd/actionlint 1.7.12, pinned by digest; it only reads this checkout.
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - run: shellcheck scripts/*.sh

  image-layers:
    name: Platform image layers build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # In the Deploy workflow these layers sit on images built from the two services. A plain base
      # is enough to check what the layers add themselves: the RDS certificate bundle download.
      - run: docker build --build-arg BASE_IMAGE=node:24-alpine -t platform-occ-api:ci images/occ-api
      - run: docker build --build-arg BASE_IMAGE=node:24-alpine -t platform-ingest:ci images/ingest

  # Builds from ops-command-center's current main on purpose: it is the check that notices when
  # that repository moves or changes the realm. For the same reason it is not a gate on merging
  # here; a red result means "look at the other repository", not "this change is wrong".
  keycloak-image:
    name: Keycloak image builds from the current realm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: truongtankhanh/ops-command-center
          path: occ
      - run: scripts/prepare-realm.sh occ/docker/keycloak/occ-realm.json
      - run: docker build -t platform-keycloak:ci images/keycloak
      - name: The realm has no demo users and no demo secrets
        run: |
          docker run --rm --entrypoint cat platform-keycloak:ci /opt/keycloak/data/import/occ-realm.json \
            | jq -e '
                (.users | all(.serviceAccountClientId != null))
                and (.clients | all(has("secret") | not))
                and (.clients | map(.clientId) | index("occ-console"))'

  # Only on the weekly run and by hand: a new advisory must not block an unrelated pull request.
  audit:
    name: npm audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
