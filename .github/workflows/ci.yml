name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, synth (both stages, cdk-nag)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The database bootstrap's integration test runs against this throwaway server.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Synthesis runs every AWS Solutions check; an unacknowledged finding fails here.
      - run: npm run synth
      - run: npm run synth:production
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-assembly
          path: cdk.out
          retention-days: 7

  keycloak-image:
    name: Keycloak image builds from the current realm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: truongtankhanh/ops-command-center
          path: occ
      - run: scripts/prepare-realm.sh occ/docker/keycloak/occ-realm.json
      - run: docker build -t platform-keycloak:ci images/keycloak
      - name: The realm has no demo users and no demo secrets
        run: |
          docker run --rm --entrypoint cat platform-keycloak:ci /opt/keycloak/data/import/occ-realm.json \
            | jq -e '
                (.users | all(.serviceAccountClientId != null))
                and (.clients | all(has("secret") | not))
                and (.clients | map(.clientId) | index("occ-console"))'
